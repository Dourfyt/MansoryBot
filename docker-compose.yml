# Полный стек: PostgreSQL + бот + админка + anon-child (одна БД).
#
# Подготовка: скопируйте .env.example в .env и заполните BOT_TOKEN, секреты и т.д.
#
# Запуск:
#   docker compose up -d --build
#
# Анонимные чаты: ANONYMOUS_CHATS_ENABLED=true в .env (по умолчанию false).
# Сервис anon-child всегда в стеке; при false сразу выходит. Опрос БД: ANONYMOUS_CHILD_POLL_INTERVAL с (по умолчанию 15).
#
# Тесты (нужен поднятый postgres; в .env для сети Docker задайте DATABASE_URL с хостом postgres):
#   docker compose up -d postgres
#   docker compose --profile test run --rm test-python
#   docker compose --profile test run --rm test-admin
# DATABASE_URL для bot/admin: тот же POSTGRES_USER/PASSWORD, пароль в URL обязательно
# percent-encoded (/ → %2F, + → %2B, = → %3D), иначе psycopg2/node-pg не подключатся.
#
# Часовой пояс внутри контейнеров (date, логи, APScheduler). По умолчанию Europe/Moscow.
# Переопределение: в .env добавьте TZ=Europe/Berlin и т.п.

services:
  postgres:
    image: postgres:15-alpine
    # Важно: при POSTGRES_USER≠postgres роль «postgres» в кластере не создаётся.
    # Любые клиенты (GUI, psql) должны подключаться как mansory_admin + POSTGRES_PASSWORD ниже.
    environment:
      TZ: ${TZ:-Europe/Moscow}
      POSTGRES_USER: mansory_admin
      POSTGRES_PASSWORD: cxoEmYHd5c5FYWT6hMoDezrNaUPDQBebDIG3CjBeCtBbNcCjSnQAmugnjNLdzqig
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mansory_admin -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      BROADCAST_SERVER_HOST: "0.0.0.0"
      BROADCAST_SERVER_PORT: "8765"
      ANONYMOUS_CHATS_ENABLED: ${ANONYMOUS_CHATS_ENABLED:-false}
      DATABASE_URL: postgresql://mansory_admin:cxoEmYHd5c5FYWT6hMoDezrNaUPDQBebDIG3CjBeCtBbNcCjSnQAmugnjNLdzqig@postgres:5432/crm
    volumes:
      - bot_logs:/app/logs
    ports:
      - "8765:8765"

  # Дочерние боты анонимных чатов (токены из CRM). При ANONYMOUS_CHATS_ENABLED=false процесс сразу выходит.
  anon-child:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "anonymous_child_runner.py"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      ANONYMOUS_CHATS_ENABLED: ${ANONYMOUS_CHATS_ENABLED:-false}
      DATABASE_URL: postgresql://mansory_admin:cxoEmYHd5c5FYWT6hMoDezrNaUPDQBebDIG3CjBeCtBbNcCjSnQAmugnjNLdzqig@postgres:5432/crm
      ANONYMOUS_CHILD_POLL_INTERVAL: ${ANONYMOUS_CHILD_POLL_INTERVAL:-15}
      BROADCAST_RELAY_URL: http://bot:8765/broadcast/relay-anonymous-photo-check

  admin:
    build:
      context: ./admin-app
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      NODE_ENV: production
      ANONYMOUS_CHATS_ENABLED: ${ANONYMOUS_CHATS_ENABLED:-false}
      DATABASE_URL: postgresql://mansory_admin:cxoEmYHd5c5FYWT6hMoDezrNaUPDQBebDIG3CjBeCtBbNcCjSnQAmugnjNLdzqig@postgres:5432/crm
      BOT_BROADCAST_URL: http://bot:8765
    ports:
      - "3000:3000"

  test-python:
    profiles: [test]
    image: python:3.12-slim-bookworm
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      BOT_TOKEN: "0000000000:TEST_TOKEN_FOR_PYTEST"
      DATABASE_URL: postgresql://mansory_admin:cxoEmYHd5c5FYWT6hMoDezrNaUPDQBebDIG3CjBeCtBbNcCjSnQAmugnjNLdzqig@postgres:5432/crm
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir -r requirements-dev.txt &&
        pytest tests/ -v --tb=short

  test-admin:
    profiles: [test]
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./admin-app:/app
    command:
      - sh
      - -c
      - |
        npm ci &&
        npm test

volumes:
  bot_logs:
  crm_pgdata:
